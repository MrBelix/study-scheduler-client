server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routing (react-router-dom) owns paths like /students/123.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
